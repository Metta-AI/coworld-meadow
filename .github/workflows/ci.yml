name: Native training evidence
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  training:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Complete wording and encoding workflows
        run: python tools/test_prompt_games.py
      - name: Actual native player and engine episodes
        run: python tools/test_native_trajectory.py "$GITHUB_SHA" "$RUNNER_TEMP/meadow-native"
      - name: Whole production teacher corpus
        run: |
          for variant in default anonymous institutions no-chat; do
            for wording in canonical plain numbered questions reordered; do
              output="$RUNNER_TEMP/meadow-$variant-$wording"
              python tools/export_posttrain.py "$output" --variant "$variant" --games 10 --prompt-variant "$wording"
              python tools/test_source_candidates.py "$output"
            done
          done
      - name: Published eight-seat held-out episode
        run: python tools/test_native_trajectory.py "$GITHUB_SHA" "$RUNNER_TEMP/meadow-published" --variant default --wording heldout-briefing --mode accepted
