<!doctype html>
<title>Coworld Meadow Replay</title>
<style>
  :root {
    --ink: #172033;
    --muted: #637089;
    --page: #eef2f7;
    --panel: #ffffff;
    --green: #059669;
    --red: #dc2626;
  }
  * {
    box-sizing: border-box;
  }
  body {
    background: radial-gradient(circle at top left, #ffffff 0, var(--page) 420px);
    color: var(--ink);
    font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    margin: 0;
    min-height: 100vh;
    padding: 28px;
  }
  main {
    display: grid;
    gap: 18px;
    grid-template-columns: minmax(320px, 760px) minmax(240px, 340px);
  }
  h1 {
    font-size: clamp(28px, 4vw, 44px);
    margin: 0 0 6px;
  }
  .eyebrow {
    color: var(--muted);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  #status {
    background: #172033;
    border-radius: 999px;
    color: white;
    display: inline-flex;
    font-size: 13px;
    font-weight: 800;
    margin: 8px 0 16px;
    padding: 7px 12px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid #dbe2ee;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(23, 32, 51, 0.08);
    margin-bottom: 16px;
    padding: 14px 16px;
  }
  .panel h2 {
    color: var(--muted);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.06em;
    margin: 0 0 10px;
    text-transform: uppercase;
  }
  svg {
    display: block;
    width: 100%;
  }
  #controls {
    align-items: center;
    display: flex;
    gap: 10px;
  }
  #controls button {
    background: var(--ink);
    border: 0;
    border-radius: 8px;
    color: white;
    cursor: pointer;
    font-weight: 800;
    padding: 8px 14px;
  }
  #scrubber {
    flex: 1;
  }
  table {
    border-collapse: collapse;
    font-size: 13px;
    width: 100%;
  }
  th,
  td {
    border-bottom: 1px solid #eef1f7;
    padding: 5px 6px;
    text-align: right;
  }
  th:first-child,
  td:first-child {
    text-align: left;
  }
  th {
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
  }
  #chat {
    font-size: 13px;
    max-height: 300px;
    overflow-y: auto;
  }
  #chat div {
    border-bottom: 1px solid #eef1f7;
    padding: 4px 0;
  }
  #chat b {
    color: var(--green);
  }
  .sanction {
    color: var(--red);
  }
</style>
<div class="eyebrow">Coworld · Meadow · Replay</div>
<h1>Meadow replay</h1>
<div id="status">loading replay…</div>
<main>
  <section>
    <div class="panel">
      <h2>Shared stock over rounds</h2>
      <svg id="chart" viewBox="0 0 720 240" preserveAspectRatio="none"></svg>
      <div id="controls">
        <button id="play">⏸</button>
        <input id="scrubber" type="range" min="0" max="0" value="0" />
        <span id="round-label" style="font-weight: 800"></span>
      </div>
    </div>
    <div class="panel">
      <h2>Players at this round</h2>
      <table>
        <thead>
          <tr>
            <th>Player</th>
            <th>Demand</th>
            <th>Harvest</th>
            <th>Score</th>
          </tr>
        </thead>
        <tbody id="players"></tbody>
      </table>
    </div>
  </section>
  <aside>
    <div class="panel">
      <h2>Chat &amp; sanctions up to here</h2>
      <div id="chat"></div>
    </div>
  </aside>
</main>
<script>
  const statusEl = document.getElementById('status')
  const chartEl = document.getElementById('chart')
  const playersEl = document.getElementById('players')
  const chatEl = document.getElementById('chat')
  const scrubber = document.getElementById('scrubber')
  const playButton = document.getElementById('play')
  const roundLabel = document.getElementById('round-label')
  let replay = null
  let frameIndex = 0
  let playing = true

  function chart(frames, upTo, capacity, threshold) {
    const width = 720
    const height = 240
    const pad = 8
    const n = Math.max(frames.length, 2)
    const x = (index) => pad + (index * (width - 2 * pad)) / (n - 1)
    const y = (value) => height - pad - (value / capacity) * (height - 2 * pad)
    const points = frames.map((frame, index) => `${x(index).toFixed(1)},${y(frame.stock_after_regrowth).toFixed(1)}`)
    const cursorX = x(upTo)
    return `
      <line x1="${pad}" y1="${y(threshold)}" x2="${width - pad}" y2="${y(threshold)}"
            stroke="#dc2626" stroke-dasharray="6 5" stroke-width="1.5"/>
      <line x1="${pad}" y1="${y(capacity / 2)}" x2="${width - pad}" y2="${y(capacity / 2)}"
            stroke="#059669" stroke-dasharray="2 6" stroke-width="1"/>
      <polyline points="${points.join(' ')}" fill="none" stroke="#c3cddd" stroke-width="2"/>
      <polyline points="${points.slice(0, upTo + 1).join(' ')}" fill="none" stroke="#172033" stroke-width="2.5"/>
      <line x1="${cursorX}" y1="${pad}" x2="${cursorX}" y2="${height - pad}" stroke="#2563eb" stroke-width="1.5"/>`
  }

  function render() {
    const frames = replay.frames
    const frame = frames[frameIndex]
    const config = replay.config
    const collapsed = frame.collapsed
    statusEl.textContent =
      `round ${frame.round + 1}/${frames.length} · stock ${frame.stock_after_regrowth.toFixed(1)}` +
      (collapsed ? ' · COLLAPSED' : '') +
      ` · welfare ${replay.results.welfare}`
    chartEl.innerHTML = chart(frames, frameIndex, config.stock_capacity ?? 100, config.collapse_threshold ?? 10)
    scrubber.max = frames.length - 1
    scrubber.value = frameIndex
    roundLabel.textContent = `r${frame.round + 1}`
    playersEl.innerHTML = replay.player_names
      .map(
        (name, slot) =>
          `<tr><td>${name}</td><td>${frame.demands[slot]}</td>
           <td>${frame.harvests[slot].toFixed(2)}</td><td>${frame.scores[slot].toFixed(1)}</td></tr>`
      )
      .join('')
    chatEl.innerHTML = ''
    for (let index = frameIndex; index >= 0; index -= 1) {
      for (const sanction of frames[index].sanctions) {
        const line = document.createElement('div')
        line.className = 'sanction'
        line.textContent = `r${index + 1} ⚡ ${replay.player_names[sanction.by]} sanctioned ${replay.player_names[sanction.target]}`
        chatEl.appendChild(line)
      }
      for (const message of frames[index].messages) {
        const line = document.createElement('div')
        line.innerHTML = `r${index + 1} <b>${replay.player_names[message.slot]}</b> ${message.text.replace(/</g, '&lt;')}`
        chatEl.appendChild(line)
      }
    }
  }

  function tick() {
    if (!replay || !playing) return
    frameIndex = frameIndex + 1 >= replay.frames.length ? 0 : frameIndex + 1
    render()
  }
  setInterval(tick, 400)

  scrubber.oninput = () => {
    playing = false
    playButton.textContent = '▶'
    frameIndex = Number(scrubber.value)
    render()
  }
  playButton.onclick = () => {
    playing = !playing
    playButton.textContent = playing ? '⏸' : '▶'
  }

  const target = new URL(window.location.href)
  target.pathname = '/replay'
  target.search = ''
  if (target.protocol === 'http:') target.protocol = 'ws:'
  if (target.protocol === 'https:') target.protocol = 'wss:'
  const socket = new WebSocket(target)
  socket.onmessage = (event) => {
    const message = JSON.parse(event.data)
    if (message.type !== 'replay' || !message.frames.length) return
    replay = message
    frameIndex = 0
    render()
  }
</script>
